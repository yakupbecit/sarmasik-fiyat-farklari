<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Firma Cari Takip</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f3f4f6;color:#111827}
header{background:#111827;color:white;padding:18px 16px;position:sticky;top:0;z-index:5}h1{margin:0;font-size:21px}.wrap{max-width:760px;margin:auto;padding:14px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:white;border-radius:14px;padding:14px;box-shadow:0 1px 5px #0001}.label{font-size:12px;color:#6b7280}.val{font-size:20px;font-weight:700;margin-top:5px}
button{border:0;border-radius:11px;padding:12px 14px;font-weight:700;cursor:pointer}.primary{background:#111827;color:white}.danger{background:#fee2e2;color:#991b1b}.ghost{background:#e5e7eb;color:#111827}
.toolbar{display:flex;gap:8px;margin:14px 0}.toolbar button{flex:1}.section{margin-top:18px}.section h2{font-size:17px}
.item{background:white;border-radius:14px;padding:14px;margin:9px 0;box-shadow:0 1px 5px #0001}.row{display:flex;justify-content:space-between;gap:10px}.muted{color:#6b7280;font-size:13px}.amount{font-weight:800}.remaining{font-size:18px;font-weight:800;margin-top:8px}
input,select{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:10px;background:white;font-size:16px;margin:5px 0 11px}
dialog{width:min(720px,94vw);border:0;border-radius:18px;padding:0;box-shadow:0 15px 50px #0005}dialog::backdrop{background:#0008}.dlg{padding:18px}.actions{display:flex;gap:8px;margin-top:8px}.actions>*{flex:1}
.hidden{display:none}.firm{font-weight:800;font-size:16px}.smallbtn{padding:8px 10px;font-size:13px}
img.preview{max-width:100%;max-height:260px;border-radius:10px;margin-top:6px}
.empty{text-align:center;color:#6b7280;padding:30px 10px}
</style>
</head>
<body>
<header><div class="wrap" style="padding:0"><h1>📒 Firma Cari Takip</h1></div></header>
<main class="wrap">
<div class="cards">
<div class="card"><div class="label">Toplam Fatura</div><div class="val" id="totalInvoice">₺0,00</div></div>
<div class="card"><div class="label">Fiyat Farkı</div><div class="val" id="totalDiff">₺0,00</div></div>
<div class="card"><div class="label">İade</div><div class="val" id="totalReturn">₺0,00</div></div>
<div class="card"><div class="label">Ödenen</div><div class="val" id="totalPaid">₺0,00</div></div>
</div>
<div class="card" style="margin-top:10px"><div class="label">GENEL KALAN BORÇ</div><div class="val" id="totalDue">₺0,00</div></div>

<div class="toolbar">
<button class="primary" onclick="openInvoice()">➕ Fatura Ekle</button>
<button class="ghost" onclick="openFirm()">🏢 Firma Ekle</button>
</div>
<input id="search" placeholder="Firma veya fatura no ara..." oninput="render()">
<div class="section"><h2>Faturalar</h2><div id="list"></div></div>
</main>

<dialog id="invoiceDlg"><div class="dlg">
<h2 id="dlgTitle">Fatura Ekle</h2>
<input type="hidden" id="editId">
<label>Firma</label><select id="firm"></select>
<label>Fatura tarihi</label><input type="date" id="date">
<label>Fatura no</label><input id="no" placeholder="Örn. A-12345">
<label>Fatura tutarı</label><input id="invoice" type="number" step="0.01" inputmode="decimal" placeholder="0">
<label>Fiyat farkı <span class="muted">(otomatik düşer)</span></label><input id="diff" type="number" step="0.01" inputmode="decimal" value="0">
<label>İade <span class="muted">(otomatik düşer)</span></label><input id="ret" type="number" step="0.01" inputmode="decimal" value="0">
<label>Ödeme <span class="muted">(otomatik düşer)</span></label><input id="paid" type="number" step="0.01" inputmode="decimal" value="0">
<label>Fatura resmi / PDF yerine fotoğraf</label><input id="photo" type="file" accept="image/*" capture="environment">
<div id="oldPhoto"></div>
<div class="actions"><button class="ghost" onclick="invoiceDlg.close()">Vazgeç</button><button class="primary" onclick="saveInvoice()">Kaydet</button></div>
</div></dialog>

<dialog id="firmDlg"><div class="dlg">
<h2>Firma Ekle</h2><input id="newFirm" placeholder="Firma adı">
<div class="actions"><button class="ghost" onclick="firmDlg.close()">Vazgeç</button><button class="primary" onclick="saveFirm()">Kaydet</button></div>
</div></dialog>

<dialog id="viewDlg"><div class="dlg" id="viewContent"></div></dialog>

<script>
const KEY="firma_cari_takip_v1";
let db=JSON.parse(localStorage.getItem(KEY)||'{"firms":[],"invoices":[]}');

function save(){localStorage.setItem(KEY,JSON.stringify(db));render();}
function money(n){return new Intl.NumberFormat("tr-TR",{style:"currency",currency:"TRY"}).format(Number(n)||0)}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function openFirm(){newFirm.value="";firmDlg.showModal()}
function saveFirm(){
 let n=newFirm.value.trim(); if(!n)return alert("Firma adını yazın.");
 if(db.firms.some(x=>x.name.toLowerCase()===n.toLowerCase()))return alert("Bu firma zaten kayıtlı.");
 db.firms.push({id:uid(),name:n}); save(); firmDlg.close();
}
function fillFirms(selected=""){
 firm.innerHTML=db.firms.length?db.firms.map(f=>`<option value="${f.id}" ${f.id===selected?"selected":""}>${esc(f.name)}</option>`).join(""):'<option value="">Önce firma ekleyin</option>';
}
function openInvoice(id=null){
 if(!db.firms.length){alert("Önce bir firma ekleyin.");openFirm();return}
 editId.value=id||""; dlgTitle.textContent=id?"Faturayı Düzenle":"Fatura Ekle";oldPhoto.innerHTML="";
 let x=db.invoices.find(i=>i.id===id);
 fillFirms(x?.firmId||db.firms[0].id);date.value=x?.date||new Date().toISOString().slice(0,10);
 no.value=x?.no||"";invoice.value=x?.invoice||"";diff.value=x?.diff||0;ret.value=x?.ret||0;paid.value=x?.paid||0;photo.value="";
 if(x?.photo)oldPhoto.innerHTML=`<div class="muted">Mevcut fotoğraf:</div><img class="preview" src="${x.photo}">`;
 invoiceDlg.showModal();
}
function saveInvoice(){
 if(!firm.value)return alert("Firma seçin.");
 if(Number(invoice.value)<=0)return alert("Fatura tutarını girin.");
 const id=editId.value||uid(); const old=db.invoices.find(i=>i.id===id);
 const file=photo.files[0];
 const data={id,firmId:firm.value,date:date.value,no:no.value.trim(),invoice:Number(invoice.value),diff:Math.abs(Number(diff.value)||0),ret:Math.abs(Number(ret.value)||0),paid:Math.abs(Number(paid.value)||0),photo:old?.photo||""};
 if(file){const r=new FileReader();r.onload=()=>{data.photo=r.result;upsert(data)};r.readAsDataURL(file)}else upsert(data);
}
function upsert(data){let idx=db.invoices.findIndex(i=>i.id===data.id);if(idx>=0)db.invoices[idx]=data;else db.invoices.push(data);save();invoiceDlg.close()}
function balance(i){return i.invoice-i.diff-i.ret-i.paid}
function firmName(id){return db.firms.find(f=>f.id===id)?.name||"Silinmiş firma"}
function render(){
 let ti=0,td=0,tr=0,tp=0;
 db.invoices.forEach(i=>{ti+=i.invoice;td+=i.diff;tr+=i.ret;tp+=i.paid});
 totalInvoice.textContent=money(ti);totalDiff.textContent=money(td);totalReturn.textContent=money(tr);totalPaid.textContent=money(tp);totalDue.textContent=money(ti-td-tr-tp);
 const q=(search.value||"").toLowerCase();
 let arr=db.invoices.filter(i=>firmName(i.firmId).toLowerCase().includes(q)||i.no.toLowerCase().includes(q)).sort((a,b)=>(b.date||"").localeCompare(a.date||""));
 list.innerHTML=arr.length?arr.map(i=>`<div class="item">
 <div class="row"><div><div class="firm">${esc(firmName(i.firmId))}</div><div class="muted">${i.date||""} ${i.no?"• "+esc(i.no):""}</div></div><div class="amount">${money(i.invoice)}</div></div>
 <div class="muted" style="margin-top:9px">Fiyat farkı: -${money(i.diff)} &nbsp; İade: -${money(i.ret)} &nbsp; Ödeme: -${money(i.paid)}</div>
 <div class="row" style="margin-top:7px"><div class="remaining">Kalan: ${money(balance(i))}</div><div>
 <button class="smallbtn ghost" onclick="viewInvoice('${i.id}')">Aç</button>
 <button class="smallbtn ghost" onclick="openInvoice('${i.id}')">Düzenle</button>
 <button class="smallbtn danger" onclick="delInvoice('${i.id}')">Sil</button>
 </div></div></div>`).join(""):'<div class="empty">Henüz fatura yok.<br>Önce firma ekleyin, sonra faturanızı kaydedin.</div>';
}
function viewInvoice(id){
 let i=db.invoices.find(x=>x.id===id); if(!i)return;
 viewContent.innerHTML=`<h2>${esc(firmName(i.firmId))}</h2>
 <p><b>Fatura:</b> ${money(i.invoice)}<br><b>Tarih:</b> ${i.date||"-"}<br><b>Fatura No:</b> ${esc(i.no)||"-"}</p>
 <p>Fiyat farkı: -${money(i.diff)}<br>İade: -${money(i.ret)}<br>Ödeme: -${money(i.paid)}</p>
 <h3>Kalan: ${money(balance(i))}</h3>
 ${i.photo?`<img class="preview" src="${i.photo}">`:"<p class='muted'>Fatura fotoğrafı eklenmemiş.</p>"}
 <div class="actions"><button class="ghost" onclick="viewDlg.close()">Kapat</button><button class="primary" onclick="viewDlg.close();openInvoice('${i.id}')">Düzenle</button></div>`;
 viewDlg.showModal();
}
function delInvoice(id){if(confirm("Bu faturayı silmek istediğinize emin misiniz?")){db.invoices=db.invoices.filter(i=>i.id!==id);save()}}
function esc(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
render();
</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
</script>
</body></html>
